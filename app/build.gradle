def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

// Local secrets (OAuth client IDs, etc.) — not checked into VCS.
// Copy secrets.properties.example to secrets.properties and fill in real values.
def secretsPropertiesFile = rootProject.file("secrets.properties")
def secretsProperties = new Properties()
if (secretsPropertiesFile.exists()) {
    secretsPropertiesFile.withInputStream { secretsProperties.load(it) }
}

def appVersionName = "1.0.3"
def appVersionCode = 10003002

base {
    archivesName = "MySubscription-" + appVersionName + "-" + appVersionCode
}

android {
    namespace = "com.mits.subscription"
    compileSdk = 35

    defaultConfig {
        applicationId = "com.mits.subscription"
        minSdk = 26
        targetSdk = 35
        versionCode = appVersionCode
        versionName = appVersionName
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        vectorDrawables {
            useSupportLibrary = true
        }

        // Android emulator's alias for the host machine's localhost, matching backend/docker-compose.yml.
        // Override per build type (see buildTypes.release below) once a real backend is deployed.
        buildConfigField "String", "BACKEND_BASE_URL", "\"http://192.168.0.3:8080/\""
        // Web OAuth client ID from Google Cloud Console — required by Credential Manager even on Android.
        // Value comes from secrets.properties (see secrets.properties.example); fill it in before
        // Google sign-in will work, see mysubscriptionsback README for how to create it.
        buildConfigField "String", "GOOGLE_SERVER_CLIENT_ID", "\"${secretsProperties.getProperty('GOOGLE_SERVER_CLIENT_ID', '')}\""
    }
    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = file(keystoreProperties['storeFile'])
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
